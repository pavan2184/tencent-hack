# Redis for Celery broker/result backend (single box). Mounted read-only by docker-compose.yml.
# Durability: AOF with fsync once per second, so queued ingest/sync/verify tasks survive a restart.
bind 0.0.0.0
protected-mode no
port 6379
dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 100
maxmemory-policy noeviction
