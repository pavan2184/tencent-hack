[project]
name = "app"
version = "0.1.0"
description = "Proof-Carrying Enterprise Knowledge: FastAPI backend (governed MCP + REST over an everything-is-a-document brain)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "mcp>=2.0",
    "python-json-logger>=3.0",
    # The three team-owned libraries (uv workspace members under libs/).
    "groundedness",
    "freshness",
    "access-control",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "anyio>=4"]

[tool.uv.sources]
groundedness = { workspace = true }
freshness = { workspace = true }
access-control = { workspace = true }

[tool.uv.workspace]
members = ["libs/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "app/tests",
    "libs/groundedness/tests",
    "libs/freshness/tests",
    "libs/access_control/tests",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = ["integration: needs a live Postgres (DATABASE_URL); skipped by default"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
