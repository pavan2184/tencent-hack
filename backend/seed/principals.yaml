# Demo personas and groups for "Example Harbor Finance" (synthetic — no real people or companies).
# Loaded by `make seed` (app/seed.py). There is no authentication: the actor is chosen with the
# X-Actor-Id header / persona switcher. See docs/SECURITY_REVIEW.md.
#
# external_identities maps a platform kind -> this principal's identity on that platform. The
# access_control policy matches raw platform permissions against it:
#   slack      -> Slack member ids (channel member_ids / workspace_member_ids)
#   jira       -> Jira account ids (project_roles members, security_level_members) = principal ids
#   confluence -> Confluence account ids (space/page view users) = principal ids
#   gdrive     -> Google account email (ACL user entries; domain entries match its domain)
#   email      -> mailbox address (from_/to/cc/bcc)
# Group ids are matched directly against platform group entries (Confluence groups, Drive groups).
#
# Ten personas, nine active. Each one anchors at least one access story; the full persona x
# document matrix and the rule each page exercises are in corpus/README.md.

groups:
  - { id: engineering, name: Engineering }
  - { id: finance-ops, name: Finance Ops }
  - { id: leadership, name: Leadership }
  - { id: compliance, name: Compliance }

principals:
  # Engineer. Sees engineering + domain-wide content; NOT the finance-only Jira issue, the private
  # #treasury-ops channel, the KYC runbook (page-restricted to finance-ops) or the board deck.
  - id: alex.tan
    display_name: Alex Tan
    email: alex.tan@example-harbor.com
    roles: [employee]
    groups: [engineering]
    external_identities:
      slack: U_ALEX
      jira: alex.tan
      confluence: alex.tan
      gdrive: alex.tan@example-harbor.com
      email: alex.tan@example-harbor.com

  # Finance Ops manager on the leadership team. Sees almost everything; loses the Q3 board deck
  # when the `leadership` grant is revoked live (demo scenario 4).
  - id: john.tan
    display_name: John Tan
    email: john.tan@example-harbor.com
    roles: [employee, manager]
    groups: [finance-ops, leadership]
    external_identities:
      slack: U_JOHN
      jira: john.tan
      confluence: john.tan
      gdrive: john.tan@example-harbor.com
      email: john.tan@example-harbor.com

  # Compliance auditor. Reads the audit trail (demo scenario 5). Sees the restricted STR register
  # only through a role grant to `auditor` (rule R5), not through the compliance group.
  - id: sam.lee
    display_name: Sam Lee
    email: sam.lee@example-harbor.com
    roles: [employee, auditor]
    groups: [compliance]
    external_identities:
      slack: U_SAM
      jira: sam.lee
      confluence: sam.lee
      gdrive: sam.lee@example-harbor.com
      email: sam.lee@example-harbor.com

  # Administrator. Manages local grants and performs revocation. Native source access still
  # applies; the Drive board deck explicitly includes this account as owner.
  - id: root.admin
    display_name: Root Admin
    email: admin@example-harbor.com
    roles: [admin]
    groups: []
    external_identities: {}

  # Treasury operations analyst. Member of the private #treasury-ops channel and the finance-only
  # Jira security level.
  - id: jordan.lim
    display_name: Jordan Lim
    email: jordan.lim@example-harbor.com
    roles: [employee]
    groups: [finance-ops]
    external_identities:
      slack: U_JORDAN
      jira: jordan.lim
      confluence: jordan.lim
      gdrive: jordan.lim@example-harbor.com
      email: jordan.lim@example-harbor.com

  # External Rail-B integration contractor with no groups and an outside email domain (demo
  # scenario 3). Sees exactly one Drive file, shared with the contractor address until 31 December;
  # the share of the Vegaline due-diligence summary expired on 30 September. Everything else is
  # invisible, and missing and denied documents look identical.
  - id: mei.chen
    display_name: Mei Chen
    email: mei.chen@contractor-example.com
    roles: [contractor]
    groups: []
    external_identities:
      slack: U_MEI

  # CFO on the leadership team. Not in the OPS Confluence space or any Jira project. Reads
  # leadership-granted Drive files, the John <-> Daniel DM, and the cutover approval email only
  # because of the bcc line. Has the manager role, so the access map opens.
  - id: daniel.wong
    display_name: Daniel Wong
    email: daniel.wong@example-harbor.com
    roles: [employee, manager]
    groups: [leadership]
    external_identities:
      slack: U_DANIEL
      jira: daniel.wong
      confluence: daniel.wong
      gdrive: daniel.wong@example-harbor.com
      email: daniel.wong@example-harbor.com

  # Head of Compliance and MLRO. Owns the COMP Confluence space pages, including the restricted
  # STR register (rule R3 owner). Not in the OPS space, so the KYC runbook stays out of reach.
  - id: nora.ibrahim
    display_name: Nora Ibrahim
    email: nora.ibrahim@example-harbor.com
    roles: [employee, manager]
    groups: [compliance]
    external_identities:
      slack: U_NORA
      jira: nora.ibrahim
      confluence: nora.ibrahim
      gdrive: nora.ibrahim@example-harbor.com
      email: nora.ibrahim@example-harbor.com

  # Payments SRE and primary on-call for the cutover. Same groups as Alex, but an explicit deny
  # (declared conflict of interest) blocks the Orionix renewal brief that engineering is granted:
  # rule R2 beats the group allow.
  - id: ravi.kumar
    display_name: Ravi Kumar
    email: ravi.kumar@example-harbor.com
    roles: [employee]
    groups: [engineering]
    external_identities:
      slack: U_RAVI
      jira: ravi.kumar
      confluence: ravi.kumar
      gdrive: ravi.kumar@example-harbor.com
      email: ravi.kumar@example-harbor.com

  # Former treasury analyst who left on 30 September 2026. The captured #treasury-ops roster still
  # lists U_LENA, but the directory marks the account inactive, so rule R1 denies every document
  # before any source ACL is read. Hidden from the persona switcher and the access map.
  - id: lena.koh
    display_name: Lena Koh
    email: lena.koh@example-harbor.com
    roles: [employee]
    groups: [finance-ops]
    is_active: false
    external_identities:
      slack: U_LENA
      jira: lena.koh
      confluence: lena.koh
      gdrive: lena.koh@example-harbor.com
      email: lena.koh@example-harbor.com
