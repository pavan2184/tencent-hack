[project]
name = "access-control"
version = "0.1.0"
description = "Access control: principals/groups, per-platform permission semantics, confidentiality, grant/revoke, no existence leak. Owner: Chai."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_control"]
