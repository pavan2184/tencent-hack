[project]
name = "groundedness"
version = "0.1.0"
description = "Groundedness: claims <-> evidence citations, support verification, abstention, prompt-injection screening. Owner: Raphael."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundedness"]
