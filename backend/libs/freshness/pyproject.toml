[project]
name = "freshness"
version = "0.1.0"
description = "Data freshness: webhook/delta/reconcile/verify state machine and freshness receipts. Owner: Pavan."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshness"]
